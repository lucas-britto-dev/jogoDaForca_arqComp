<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jogo da Forca - Arquitetura Computacional</h1>
    <img id="imagem" src="./img/forca0.png" alt="Forca">
    <div id="div_palavra"></div>
    <input type="text" id="ipt_letra" placeholder="Chute uma letra" maxlength="1">
    <button id="btn_chutar" onclick="chutarLetra()">Chutar</button>

    <h2>Letras Chutadas</h2>
    <div id="div_chutadas"></div>
    <div id="div_mensagem"></div>
    <button id="btn_reiniciar" onclick="iniciarJogo()">Recomeçar</button>
</body>
</html>
<script>
    const listaPalavras = ['processador', 'ram', 'microcontrolador', 'ula', 'barramento', 'acumulador', 'intel', 'cache', 'dma', 'registradores'];

    let palavraEscolhida;
    let exibicaoPalavra;
    let letrasChutadas;
    let tentativasRestantes;
    let numeroErros;

    function iniciarJogo() {
        ipt_letra.disabled = false;
        btn_reiniciar.style.display = 'none';
        palavraEscolhida = listaPalavras[Math.floor(Math.random()*listaPalavras.length)];
        exibicaoPalavra = Array(palavraEscolhida.length).fill('_');
        letrasChutadas = [];
        tentativasRestantes = 7;
        numeroErros = 0;

        atualizarExibicao();
    }

    function atualizarExibicao() {
        div_palavra.innerText = exibicaoPalavra.join(' ');
        div_chutadas.innerText = `${letrasChutadas.join(', ')}`;
        div_mensagem.innerText = '';
        imagem.src = `./img/forca${numeroErros}.png`

        if (tentativasRestantes === 0) {
            encerrarJogo('VOCÊ MORREU!');
        } else if (!exibicaoPalavra.includes('_')) {
            encerrarJogo('Parabéns! Você venceu')
        }
    }

    function chutarLetra() {
        let letra = ipt_letra.value;

        if (!letra.match(/[a-zà-ùç]/i)) {
            alert('Por favor, insira uma letra válida');
            return;
        }

        if (letrasChutadas.includes(letra)) {
            alert('Você já tentou esta letra. Tente outra.');
            return;
        }

        letrasChutadas.push(letra);

        if(palavraEscolhida.includes(letra)) {
            for (let i = 0; i < palavraEscolhida.length; i++) {
                if(palavraEscolhida[i] === letra) {
                    exibicaoPalavra[i] = letra;
                }
            }
        } else {
            tentativasRestantes--;
            numeroErros++;
        }

        letra.value = '';

        atualizarExibicao();
    }

    function encerrarJogo(mensagem) {
        ipt_letra.disabled = true;
        div_mensagem.innerText = mensagem;
        btn_reiniciar.style.display = 'block';
    }

    window.load = iniciarJogo();
</script>
